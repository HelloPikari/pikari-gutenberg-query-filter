name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
commitish: main

version-resolver:
  major:
    labels:
      - 'breaking'
      - 'breaking-change'
  minor:
    labels:
      - 'feature'
      - 'enhancement'
  patch:
    labels:
      - 'bug'
      - 'fix'
      - 'docs'
      - 'dependencies'
      - 'chore'
  default: patch

categories:
  - title: '🚨 Breaking Changes'
    labels:
      - 'breaking'
      - 'breaking-change'
  - title: '🎉 New Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: '🐛 Bug Fixes'
    labels:
      - 'bug'
      - 'fix'
  - title: '📚 Documentation'
    labels:
      - 'docs'
    collapse-after: 3
  - title: '🧰 Maintenance'
    labels:
      - 'chore'
      - 'ci'
    collapse-after: 3
  - title: '⬆️ Dependencies'
    labels:
      - 'dependencies'
    collapse-after: 3

exclude-labels:
  - 'skip-changelog'

autolabeler:
  - label: 'docs'
    files:
      - '*.md'
      - 'docs/**'
  # Branch prefixes mirror the commit types in CLAUDE.md, because both get used
  # as branch names. Matching only 'feature/' missed 'feat/' branches entirely —
  # they carried no label, so they resolved as a patch like anything unlabelled.
  - label: 'bug'
    branch:
      - '/fix\/.+/'
      - '/bugfix\/.+/'
  - label: 'feature'
    branch:
      - '/feature\/.+/'
      - '/feat\/.+/'
  - label: 'chore'
    branch:
      - '/chore\/.+/'
  - label: 'dependencies'
    files:
      - 'package*.json'
      - 'composer*.json'
  - label: 'ci'
    files:
      - '.github/**'

change-template: '- $TITLE @$AUTHOR (#$NUMBER)'

template: |
  ## What's Changed

  $CHANGES

  ## Installation

  ### Composer
  ```bash
  composer require pikari-inc/pikari-gutenberg-query-filter:$RESOLVED_VERSION
  ```

  ### WordPress Plugin
  Download `pikari-gutenberg-query-filter-v$RESOLVED_VERSION.zip` from the assets below.

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
