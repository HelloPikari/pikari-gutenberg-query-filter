name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: |
          npm ci
          composer install --prefer-dist --no-progress

      - name: Verify lock files are in sync
        run: |
          npm ls >/dev/null 2>&1 || (echo "package-lock.json out of sync" && exit 1)
          composer validate --no-check-version

      - name: Run linters
        id: lint
        run: |
          set +e

          echo "Running JavaScript linting..."
          npm run lint:js
          JS_EXIT=$?

          echo "Running CSS linting..."
          npm run lint:css
          CSS_EXIT=$?

          echo "Running PHP linting..."
          composer lint
          PHP_EXIT=$?

          [ $JS_EXIT -ne 0 ] && echo "js-failed=true" >> $GITHUB_OUTPUT
          [ $CSS_EXIT -ne 0 ] && echo "css-failed=true" >> $GITHUB_OUTPUT
          [ $PHP_EXIT -ne 0 ] && echo "php-failed=true" >> $GITHUB_OUTPUT

          [ $JS_EXIT -ne 0 ] || [ $CSS_EXIT -ne 0 ] || [ $PHP_EXIT -ne 0 ] && exit 1 || exit 0

      - name: Comment PR on lint failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const failures = [];
            if ('${{ steps.lint.outputs.js-failed }}' === 'true') failures.push('JavaScript');
            if ('${{ steps.lint.outputs.css-failed }}' === 'true') failures.push('CSS');
            if ('${{ steps.lint.outputs.php-failed }}' === 'true') failures.push('PHP');

            const body = `Linting failed for: ${failures.join(', ')}

            Please run the following locally to fix issues:
            ${failures.includes('JavaScript') ? '- \`npm run lint:js -- --fix\`' : ''}
            ${failures.includes('CSS') ? '- \`npm run lint:css -- --fix\`' : ''}
            ${failures.includes('PHP') ? '- \`composer lint:fix\`' : ''}

            Then commit and push the changes.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            })

      - name: Security audit
        run: |
          echo "Running npm audit..."
          npm audit --audit-level=high --omit=dev

          echo "Running composer audit..."
          composer audit --locked

      - name: Validate block registration paths
        run: |
          echo "Checking for register_block_type calls using src/ paths..."
          if grep -rn "register_block_type.*src/" --include="*.php" .; then
            echo "::error::Found register_block_type() using src/ paths. Use build/blocks/ instead — src/ is excluded from distribution ZIPs."
            exit 1
          fi
          echo "All block registration paths are correct"

      - name: Verify version locations agree
        run: |
          HEADER="$(sed -n 's/^ \* Version:[[:space:]]*//p' pikari-gutenberg-query-filter.php | head -1 | tr -d '[:space:]' || true)"
          PKG="$(node -p "require('./package.json').version")"
          CONST="$(grep -oE "define\( *'PIKARI_[A-Z0-9_]*VERSION', *'[^']*'" pikari-gutenberg-query-filter.php | head -1 | sed "s/.*'\([^']*\)'$/\1/" || true)"

          echo "header:       $HEADER"
          echo "package.json: $PKG"
          echo "const:        $CONST"

          if [ "$HEADER" != "$PKG" ] || { [ -n "$CONST" ] && [ "$CONST" != "$HEADER" ]; }; then
            echo "::error::Version locations disagree. Run: node .github/bump-version.js <plugin-dir> $HEADER"
            exit 1
          fi
          echo "Versions agree."

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install & Build
        run: |
          npm ci
          npm run build

      - name: Verify build
        run: |
          test -d build || (echo "Build directory missing" && exit 1)
          echo "Build verification successful"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: build/
          retention-days: 1

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: |
          npm ci
          composer install --prefer-dist --no-progress

      # Some PHP tests run against the REAL WP_HTML_Tag_Processor (not
      # Brain\Monkey) and self-skip when no WordPress core checkout is
      # discoverable via WP_CORE_DIR — e.g. modals' BlockSupportRenderTest and
      # query-filter's BlockFiltersTest. Rather than installing all of
      # WordPress, download just the handful of wp-includes files those tests
      # load, pinned to a tag known to work together and cached so this only
      # hits the network once per pin.
      - name: Cache WordPress HTML API files
        id: wp-html-api-cache
        uses: actions/cache@v6
        with:
          path: /tmp/wp-core-min
          key: wp-html-api-7.1.0

      - name: Download WordPress HTML API files
        if: steps.wp-html-api-cache.outputs.cache-hit != 'true'
        run: |
          base="https://raw.githubusercontent.com/WordPress/wordpress-develop/7.1.0/src/wp-includes"
          mkdir -p /tmp/wp-core-min/wp-includes/html-api
          for f in \
            class-wp-token-map.php \
            html-api/html5-named-character-references.php \
            html-api/class-wp-html-attribute-token.php \
            html-api/class-wp-html-span.php \
            html-api/class-wp-html-doctype-info.php \
            html-api/class-wp-html-text-replacement.php \
            html-api/class-wp-html-decoder.php \
            utf8.php \
            html-api/class-wp-html-tag-processor.php \
          ; do
            curl -fsSL "$base/$f" -o "/tmp/wp-core-min/wp-includes/$f"
          done

      - name: Run PHP tests
        env:
          WP_CORE_DIR: /tmp/wp-core-min
        run: composer test

      - name: Run JS tests
        run: npm test
