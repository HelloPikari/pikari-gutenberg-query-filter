name: Update Dist Branch

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build from'
        required: true

permissions:
  contents: write

jobs:
  update-dist:
    name: Update Distribution Branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Verify version matches release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          TAG_VERSION="${RELEASE_TAG#v}"
          HEADER_VERSION="$(sed -n 's/^ \* Version:[[:space:]]*//p' pikari-gutenberg-query-filter.php | head -1 | tr -d '[:space:]')"
          PKG_VERSION="$(node -p "require('./package.json').version")"

          echo "release tag:   $TAG_VERSION"
          echo "plugin header: $HEADER_VERSION"
          echo "package.json:  $PKG_VERSION"

          FAILED=0
          if [ "$HEADER_VERSION" != "$TAG_VERSION" ]; then
            echo "::error file=pikari-gutenberg-query-filter.php::Plugin header version ($HEADER_VERSION) does not match release tag ($TAG_VERSION)."
            FAILED=1
          fi
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error file=package.json::package.json version ($PKG_VERSION) does not match release tag ($TAG_VERSION)."
            FAILED=1
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo "Refusing to build the dist branch: it would be tagged v${TAG_VERSION} while the plugin reports a different version."
            echo "This is the Composer install path — a mismatch here ships silently."
            exit 1
          fi

          echo "Versions agree."

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install Composer production dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Install dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -d "build" ] || [ -z "$(ls -A build)" ]; then
            echo "Build directory is missing or empty"
            exit 1
          fi
          echo "Build successful"
          ls -la build/

      - name: Update dist branch
        env:
          VERSION: ${{ github.event.release.tag_name || inputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # The commit the release tag pointed at when this job started — i.e. the
          # commit on main that was actually built. Read it before the tag moves.
          RELEASE_COMMIT="$(git -C "${{ github.workspace }}" rev-parse HEAD)"
          echo "Release commit: $RELEASE_COMMIT"

          echo "Cloning repository to temp directory..."
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git /tmp/dist-repo
          cd /tmp/dist-repo

          echo "Setting up dist branch..."
          if git ls-remote --heads origin dist | grep -q dist; then
            echo "Found existing dist branch"
            git fetch origin dist:dist
            git checkout dist
          else
            echo "Creating new dist branch"
            git checkout -B dist
          fi

          echo "Cleaning dist branch..."
          find . -maxdepth 1 ! -name '.git' ! -name '.' ! -name '..' -exec rm -rf {} +

          echo "Copying production files..."
          cp -r ${{ github.workspace }}/build .
          cp ${{ github.workspace }}/*.php .
          cp ${{ github.workspace }}/readme.txt .
          cp ${{ github.workspace }}/LICENSE .

          if [ -d "${{ github.workspace }}/includes" ]; then
            cp -r ${{ github.workspace }}/includes .
          fi

          if [ -d "${{ github.workspace }}/languages" ]; then
            cp -r ${{ github.workspace }}/languages .
          fi

          if [ -d "${{ github.workspace }}/parts" ]; then
            cp -r ${{ github.workspace }}/parts .
          fi

          if [ -d "${{ github.workspace }}/vendor" ]; then
            cp -r ${{ github.workspace }}/vendor .
          fi

          cat > composer.json << INNEREOF
          {
            "name": "pikari-inc/pikari-gutenberg-query-filter",
            "description": "Filter controls for the query loop block, using the interactivity API",
            "type": "wordpress-plugin",
            "license": "GPL-2.0-or-later",
            "require": {
              "php": ">=8.4"
            },
            "extra": {
              "installer-name": "pikari-gutenberg-query-filter"
            }
          }
          INNEREOF

          echo "$VERSION" > VERSION

          cat > .gitignore << 'INNEREOF'
          .DS_Store
          Thumbs.db
          *.log
          INNEREOF

          echo "Committing distribution build..."
          git add -A

          # Give the dist commit the release commit on main as a second parent.
          # The release tag has to stay on dist so Composer installs get build/,
          # but without this parent the tag shares no recent ancestry with main:
          # Release Drafter compares refs/tags/vX against main, three-dot, so the
          # merge base falls back to wherever dist was branched and the changelog
          # lists the entire history. Contents are unaffected — commit-tree writes
          # exactly the staged tree.
          # docs/superpowers/specs/2026-09-07-composer-distribution-design.md
          #
          # No "nothing changed" guard: every release must produce a commit to tag,
          # even when the built tree is identical. Skipping it would leave the tag
          # on main, where there is no build/ directory, and break Composer installs.
          DIST_PARENT="$(git rev-parse HEAD)"
          TREE="$(git write-tree)"

          if [ -n "$RELEASE_COMMIT" ] && [ "$RELEASE_COMMIT" != "$DIST_PARENT" ] &&
             git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main 2>/dev/null; then
            echo "Parenting dist commit to release commit $RELEASE_COMMIT on main."
            DIST_COMMIT="$(git commit-tree "$TREE" -p "$DIST_PARENT" -p "$RELEASE_COMMIT" -m "Distribution build for $VERSION")"
          else
            echo "::warning::Release commit $RELEASE_COMMIT is not on main (re-run of an already-moved tag?)."
            echo "::warning::Building the dist commit without a main parent — the NEXT release's changelog will list the whole history."
            DIST_COMMIT="$(git commit-tree "$TREE" -p "$DIST_PARENT" -m "Distribution build for $VERSION")"
          fi

          git update-ref refs/heads/dist "$DIST_COMMIT"
          git reset --hard dist

          echo "Pushing to dist branch..."
          if git ls-remote --heads origin dist | grep -q dist; then
            git push origin dist
          else
            git push -u origin dist
          fi

          echo "Creating version tag..."
          git tag -f "$VERSION" "$DIST_COMMIT"
          git push -f origin "$VERSION"

          echo "Distribution branch updated successfully!"
          echo "Version $VERSION is now available for Composer installation"
