name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build Release Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Verify version matches release tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          HEADER_VERSION="$(sed -n 's/^ \* Version:[[:space:]]*//p' pikari-gutenberg-query.php | head -1 | tr -d '[:space:]')"
          PKG_VERSION="$(node -p "require('./package.json').version")"

          echo "release tag:   $TAG_VERSION"
          echo "plugin header: $HEADER_VERSION"
          echo "package.json:  $PKG_VERSION"

          FAILED=0
          if [ "$HEADER_VERSION" != "$TAG_VERSION" ]; then
            echo "::error file=pikari-gutenberg-query.php::Plugin header version ($HEADER_VERSION) does not match release tag ($TAG_VERSION)."
            FAILED=1
          fi
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error file=package.json::package.json version ($PKG_VERSION) does not match release tag ($TAG_VERSION)."
            FAILED=1
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo "Refusing to build: the ZIP would be named v${TAG_VERSION} while the plugin reports a different version."
            echo "Fix the version, delete this release and its tag, then re-tag and re-publish."
            exit 1
          fi

          echo "Versions agree."

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install Composer production dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build

      - name: Create distribution ZIP
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SLUG="pikari-gutenberg-query"

          echo "Building release for version: $VERSION"

          mkdir -p /tmp/dist/$SLUG

          echo "Creating production distribution..."
          rsync -av \
            --exclude='.git*' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='src' \
            --exclude='tests' \
            --exclude='.*' \
            --exclude='*.log' \
            --exclude='*.lock' \
            --exclude='composer.*' \
            --exclude='package*' \
            --exclude='webpack.*' \
            --exclude='*.md' \
            --exclude='bin' \
            --exclude='_playground' \
            --exclude='.husky' \
            --exclude='*.sh' \
            --exclude='phpcs.xml' \
            --exclude='*.config.*' \
            --exclude='_log' \
            --exclude='_specs' \
            --exclude='docs' \
            . /tmp/dist/$SLUG/

          if [ ! -d "/tmp/dist/$SLUG/build" ]; then
            echo "Build directory missing from distribution"
            exit 1
          fi

          cd /tmp/dist
          zip -r "${SLUG}-v${VERSION}.zip" $SLUG
          mv "${SLUG}-v${VERSION}.zip" $GITHUB_WORKSPACE/

          echo "Created distribution ZIP: ${SLUG}-v${VERSION}.zip"

          cd $GITHUB_WORKSPACE
          sha256sum "${SLUG}-v${VERSION}.zip" > "${SLUG}-v${VERSION}-checksums.txt"
          md5sum "${SLUG}-v${VERSION}.zip" >> "${SLUG}-v${VERSION}-checksums.txt"

          echo "ZIP_FILE=${SLUG}-v${VERSION}.zip" >> $GITHUB_ENV
          echo "CHECKSUMS_FILE=${SLUG}-v${VERSION}-checksums.txt" >> $GITHUB_ENV

      - name: Verify distribution
        run: |
          echo "Distribution contents:"
          unzip -l "${{ env.ZIP_FILE }}" | head -20

          echo -e "\nChecksums:"
          cat "${{ env.CHECKSUMS_FILE }}"

          echo -e "\nZIP size:"
          ls -lh "${{ env.ZIP_FILE }}"

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ env.ZIP_FILE }}
            ${{ env.CHECKSUMS_FILE }}
          tag_name: ${{ github.event.release.tag_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
